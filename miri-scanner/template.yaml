AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >

  MIRI-Scanner: AWS Security Audit Automation Tool

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 10

Resources:
  ScannerFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: scanner_engine/
      Handler: app.lambda_handler
      Runtime: python3.10
      Architectures:
        - arm64
      # Policies 추가
      Policies:
        - Statement:
          - Effect: Allow
            Action: "sts:AssumeRole"
            Resource: "arn:aws:iam::*:role/miri-scanner-role"
      Events:
        ScanApi:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /scan
            Method: post

Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  ScannerApi:
    Description: "API Gateway endpoint URL for MIRI Scanner"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/scan/"
  ScannerFunctionArn:
    Description: "MIRI Scanner Lambda Function ARN"
    Value: !GetAtt ScannerFunction.Arn
  ScannerFunctionIamRole:
    Description: "Implicit IAM Role created for MIRI Scanner function"
    Value: !GetAtt ScannerFunctionRole.Arn
